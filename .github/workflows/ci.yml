name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafe_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cafe_platform_test
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-also-long-enough
      ANTHROPIC_API_KEY: sk-ant-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate

      - name: Apply migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - name: Typecheck (backend)
        run: pnpm --filter backend exec tsc -p tsconfig.build.json --noEmit

      - name: Typecheck (admin)
        run: pnpm --filter @cafe/admin exec tsc --noEmit

      - name: Test (backend)
        run: pnpm --filter backend test

      - name: Build (backend)
        run: pnpm --filter backend build

      - name: Build (admin)
        run: pnpm --filter @cafe/admin build
